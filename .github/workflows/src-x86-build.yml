name: "x86 Build - src"

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'nntrainer/**'
      - '.github/workflows/src-x86-build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'nntrainer/**'
      - '.github/workflows/src-x86-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            g++ \
            pkg-config \
            libomp-dev

      - name: Cache nntrainer x86 build
        id: cache-nntrainer
        uses: actions/cache@v4
        with:
          path: nntrainer/builddir_x86
          key: nntrainer-x86-${{ hashFiles('nntrainer/**/*.cpp', 'nntrainer/**/*.h', 'nntrainer/meson.build') }}

      - name: Build src (x86)
        run: |
          chmod +x src/build_x86.sh
          src/build_x86.sh

      - name: Verify build artifacts
        run: |
          echo "Checking build outputs..."
          ls -la src/builddir/
          test -f src/builddir/quick_dot_ai
          test -f src/builddir/libcausallm.so
          test -f src/builddir/libquick_dot_ai.so
          echo "All artifacts verified."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: src-x86-linux
          path: |
            src/builddir/quick_dot_ai
            src/builddir/libcausallm.so
            src/builddir/libquick_dot_ai.so
          retention-days: 7
