name: "x86 Build - src"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'nntrainer/**'
      - 'build.sh'
      - 'meson.build'
      - 'meson.options'
      - '.github/workflows/src-x86-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'nntrainer/**'
      - 'build.sh'
      - 'meson.build'
      - 'meson.options'
      - '.github/workflows/src-x86-build.yml'

jobs:
  build:
    if: "!contains(github.event.pull_request.title || '', '@')"
    runs-on: [ code-linux ] 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            g++ \
            pkg-config \
            libomp-dev \
            cmake \
            libopenblas-dev

      - name: Cache nntrainer x86 build
        id: cache-nntrainer
        uses: actions/cache@v4
        with:
          path: nntrainer/builddir_x86
          key: nntrainer-x86-${{ hashFiles('nntrainer/**/*.cpp', 'nntrainer/**/*.h', 'nntrainer/meson.build') }}

      - name: Build src (x86)
        env:
          BUILD_JOBS: "1"
        run: |
          chmod +x build.sh
          ./build.sh --platform=x86 --target=src

      - name: Verify build artifacts
        run: |
          echo "Checking build outputs..."
          ls -la builddir_x86/src/
          test -f builddir_x86/src/quick_dot_ai
          test -f builddir_x86/src/libcausallm.so
          test -f builddir_x86/src/libquick_dot_ai.so
          echo "All artifacts verified."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: src-x86-linux
          path: |
            builddir_x86/src/quick_dot_ai
            builddir_x86/src/libcausallm.so
            builddir_x86/src/libquick_dot_ai.so
          retention-days: 7
