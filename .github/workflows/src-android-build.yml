name: "Android Build - src"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'nntrainer/**'
      - '.github/workflows/src-android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'nntrainer/**'
      - '.github/workflows/src-android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK: ${{ github.workspace }}/android-ndk-r26d
      NDK_VERSION: r26d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - name: Install Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          rm android-ndk-${NDK_VERSION}-linux.zip

      - name: Cache nntrainer Android build
        id: cache-nntrainer
        uses: actions/cache@v4
        with:
          path: nntrainer/builddir
          key: nntrainer-android-${{ hashFiles('nntrainer/**/*.cpp', 'nntrainer/**/*.h', 'nntrainer/meson.build') }}

      - name: Build src (Android)
        run: |
          chmod +x src/build_android.sh
          src/build_android.sh --clean

      - name: Verify build artifacts
        run: |
          echo "Checking build outputs..."
          ls -la src/jni/libs/arm64-v8a/
          test -f src/jni/libs/arm64-v8a/libcausallm.so
          test -f src/jni/libs/arm64-v8a/libquick_dot_ai.so
          test -f src/jni/libs/arm64-v8a/quick_dot_ai_exe
          echo "All artifacts verified."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: src-android-arm64-v8a
          path: src/jni/libs/arm64-v8a/
          retention-days: 7
