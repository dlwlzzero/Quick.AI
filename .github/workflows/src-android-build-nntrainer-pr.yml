name: "Android Build - src (nntrainer PR)"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'src/**'
      - 'nntrainer/**'
      - 'build.sh'
      - 'meson.build'
      - 'meson.options'
      - 'cross/**'
      - '.github/workflows/src-android-build-nntrainer-pr.yml'

jobs:
  build:
    if: contains(github.event.pull_request.title, '@')
    runs-on: [ code-linux ] 
    env:
      ANDROID_NDK: ${{ github.workspace }}/android-ndk-r26d
      NDK_VERSION: r26d

    steps:
      - name: Extract nntrainer PR number
        id: extract-pr
        run: |
          NNTRAINER_PR=$(echo "${{ github.event.pull_request.title }}" | grep -oP '@\K[0-9]+$' || true)
          if [ -z "$NNTRAINER_PR" ]; then
            echo "No @number found at end of PR title, skipping"
            exit 1
          fi
          echo "pr_number=${NNTRAINER_PR}" >> "$GITHUB_OUTPUT"
          echo "Using nntrainer PR #${NNTRAINER_PR}"

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Checkout nntrainer from upstream PR
        run: |
          rm -rf nntrainer
          git clone --depth=1 --recurse-submodules https://github.com/nntrainer/nntrainer.git nntrainer
          cd nntrainer
          git fetch origin "pull/${{ steps.extract-pr.outputs.pr_number }}/head:nntrainer-pr"
          git checkout nntrainer-pr
          git submodule update --init --recursive

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - name: Install Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          rm android-ndk-${NDK_VERSION}-linux.zip

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y cmake
          pip install meson ninja

      - name: Install Rust with Android target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add aarch64-linux-android

      - name: Cache nntrainer Android build
        id: cache-nntrainer
        uses: actions/cache@v4
        with:
          path: nntrainer/builddir
          key: nntrainer-pr-android-${{ steps.extract-pr.outputs.pr_number }}-${{ hashFiles('nntrainer/**/*.cpp', 'nntrainer/**/*.h', 'nntrainer/meson.build') }}

      - name: Add NDK and Cargo to PATH
        run: |
          echo "$ANDROID_NDK" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Fix meson install permissions
        run: sudo chmod -R o+w /usr/local/lib/

      - name: Build src (Android)
        env:
          SKIP_SUBMODULE_UPDATE: "1"
        run: |
          chmod +x build.sh
          ./build.sh --platform=android --target=src --clean

      - name: Verify build artifacts
        run: |
          echo "Checking build outputs..."
          ls -la builddir_android/src/
          test -f builddir_android/src/libcausallm.so
          test -f builddir_android/src/libquick_dot_ai.so
          test -f builddir_android/src/quick_dot_ai
          echo "All artifacts verified."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: src-android-arm64-v8a-nntrainer-pr
          path: builddir_android/src/
          retention-days: 7
