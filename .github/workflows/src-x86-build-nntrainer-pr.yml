name: "x86 Build - src (nntrainer PR)"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'src/**'
      - 'nntrainer/**'
      - 'build.sh'
      - 'meson.build'
      - 'meson.options'
      - '.github/workflows/src-x86-build-nntrainer-pr.yml'

jobs:
  build:
    if: contains(github.event.pull_request.title, '@')
    runs-on: [ code-linux ] 

    steps:
      - name: Extract nntrainer PR number
        id: extract-pr
        run: |
          NNTRAINER_PR=$(echo "${{ github.event.pull_request.title }}" | grep -oP '@\K[0-9]+$' || true)
          if [ -z "$NNTRAINER_PR" ]; then
            echo "No @number found at end of PR title, skipping"
            exit 1
          fi
          echo "pr_number=${NNTRAINER_PR}" >> "$GITHUB_OUTPUT"
          echo "Using nntrainer PR #${NNTRAINER_PR}"

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Checkout nntrainer from upstream PR
        run: |
          rm -rf nntrainer
          git clone --depth=1 --recurse-submodules https://github.com/nntrainer/nntrainer.git nntrainer
          cd nntrainer
          git fetch origin "pull/${{ steps.extract-pr.outputs.pr_number }}/head:nntrainer-pr"
          git checkout nntrainer-pr
          git submodule update --init --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            g++ \
            pkg-config \
            libomp-dev \
            cmake \
            libopenblas-dev

      - name: Cache nntrainer x86 build
        id: cache-nntrainer
        uses: actions/cache@v4
        with:
          path: nntrainer/builddir_x86
          key: nntrainer-pr-x86-${{ steps.extract-pr.outputs.pr_number }}-${{ hashFiles('nntrainer/**/*.cpp', 'nntrainer/**/*.h', 'nntrainer/meson.build') }}

      - name: Build src (x86)
        env:
          SKIP_SUBMODULE_UPDATE: "1"
          BUILD_JOBS: "1"
        run: |
          chmod +x build.sh
          ./build.sh --platform=x86 --target=src

      - name: Verify build artifacts
        run: |
          echo "Checking build outputs..."
          ls -la builddir_x86/src/
          test -f builddir_x86/src/quick_dot_ai
          test -f builddir_x86/src/libcausallm.so
          test -f builddir_x86/src/libquick_dot_ai.so
          echo "All artifacts verified."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: src-x86-linux-nntrainer-pr
          path: |
            builddir_x86/src/quick_dot_ai
            builddir_x86/src/libcausallm.so
            builddir_x86/src/libquick_dot_ai.so
          retention-days: 7
