name: "Android Build - api-app"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'api-app/**'
      - 'nntrainer/**'
      - 'build.sh'
      - 'meson.build'
      - 'meson.options'
      - 'cross/**'
      - '.github/workflows/api-app-android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'api-app/**'
      - 'nntrainer/**'
      - 'build.sh'
      - 'meson.build'
      - 'meson.options'
      - 'cross/**'
      - '.github/workflows/api-app-android-build.yml'

jobs:
  build:
    if: "!contains(github.event.pull_request.title || '', '@')"
    runs-on: [ code-linux ] 
    env:
      ANDROID_NDK: ${{ github.workspace }}/android-ndk-r26d
      NDK_VERSION: r26d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - name: Install Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          rm android-ndk-${NDK_VERSION}-linux.zip

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y cmake
          pip install meson ninja

      - name: Install Rust with Android target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add aarch64-linux-android

      - name: Cache nntrainer Android build
        id: cache-nntrainer
        uses: actions/cache@v4
        with:
          path: nntrainer/builddir
          key: nntrainer-android-${{ hashFiles('nntrainer/**/*.cpp', 'nntrainer/**/*.h', 'nntrainer/meson.build') }}

      - name: Add NDK and Cargo to PATH
        run: |
          echo "$ANDROID_NDK" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Fix meson install permissions
        run: sudo chmod -R o+w /usr/local/lib/

      - name: Build api-app (Android)
        run: |
          chmod +x build.sh
          ./build.sh --platform=android --clean

      - name: Verify build artifacts
        run: |
          echo "Checking build outputs..."
          test -f builddir_android/api-app/quick_dot_ai_test
          echo "Checking dependency artifacts..."
          test -f builddir_android/src/libcausallm.so
          test -f builddir_android/src/libquick_dot_ai.so
          test -f builddir_android/api/libquick_dot_ai_api.so
          echo "All artifacts verified."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-app-android-arm64-v8a
          path: |
            builddir_android/api-app/quick_dot_ai_test
            builddir_android/api/libquick_dot_ai_api.so
            builddir_android/src/libcausallm.so
            builddir_android/src/libquick_dot_ai.so
          retention-days: 7
